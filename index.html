<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashFlow — Salary & Expense Tracker</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- ── Header ─────────────────────────────────────── -->
  <header>
    <div class="logo">Cash<span>Flow</span></div>

    <div class="header-actions">

      <!-- Dark / Light mode toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle dark / light mode" onclick="toggleTheme()">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
        <span id="themeLabel">Dark Mode</span>
      </button>

      <!-- Currency selector -->
      <select id="currencySelect" class="btn btn-outline"
              style="padding:9px 14px; font-family:'Syne',sans-serif; font-size:0.8rem; cursor:pointer;">
        <option value="INR">₹ INR</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
        <option value="GBP">£ GBP</option>
        <option value="JPY">¥ JPY</option>
      </select>

      <button class="btn btn-pdf"    onclick="downloadPDF()">⬇ Download PDF</button>
      <button class="btn btn-danger" onclick="clearAll()">✕ Reset</button>
    </div>
  </header>

  <!-- ── Stats Row ──────────────────────────────────── -->
  <div class="stats-row">

    <div class="stat-card salary">
      <div class="stat-label">
        Total Salary
        <span id="currBadge" class="currency-badge">INR</span>
      </div>
      <div class="stat-value" id="displaySalary">0.00</div>
    </div>

    <div class="stat-card expenses">
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value" id="displayExpenses">0.00</div>
    </div>

    <div class="stat-card balance" id="balanceCard">
      <div class="stat-label">Remaining Balance</div>
      <div class="stat-value" id="displayBalance">0.00</div>
    </div>

  </div>

  <!-- ── Budget Alert ───────────────────────────────── -->
  <div id="budgetAlert">
    ⚠ Warning: Your balance is below 10% of your salary!
  </div>

  <!-- ── Main Grid ──────────────────────────────────── -->
  <div class="main-grid">

    <!-- Left column: Forms -->
    <div>

      <!-- Salary Panel -->
      <div class="panel" style="margin-bottom: 18px;">
        <div class="panel-title">Set Salary</div>
        <div class="form-group">
          <label>Monthly Salary (Base Currency: INR)</label>
          <input type="number" id="salaryInput" placeholder="e.g. 50000" min="0" />
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="setSalary()">
          Set Salary
        </button>
      </div>

      <!-- Add Expense Panel -->
      <div class="panel">
        <div class="panel-title">Add Expense</div>
        <div class="form-group">
          <label>Expense Name</label>
          <input type="text" id="expenseName" placeholder="e.g. Netflix, Rent…" />
        </div>
        <div class="form-group">
          <label>Amount (INR)</label>
          <input type="number" id="expenseAmount" placeholder="e.g. 499" min="0" />
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="addExpense()">
          + Add Expense
        </button>
        <p id="formError"
           style="color:var(--danger); font-size:0.78rem; margin-top:10px; display:none; font-weight:600;">
        </p>
      </div>

    </div><!-- /left column -->

    <!-- Right column: List + Chart -->
    <div style="display:flex; flex-direction:column; gap:18px;">

      <!-- Expense List Panel -->
      <div class="panel">
        <div class="panel-title">Expense Breakdown</div>
        <div id="expenseList">
          <p class="empty-msg">No expenses yet. Add one above.</p>
        </div>
      </div>

      <!-- Chart Panel -->
      <div class="panel">
        <div class="panel-title">Visual Breakdown</div>
        <div class="chart-container">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

    </div><!-- /right column -->

  </div><!-- /main-grid -->

</div><!-- /app -->

<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
